name: Render Shorts Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique render job ID
        required: true
        type: string
      overlay_title:
        description: Idiom and Chinese characters shown at the top
        required: true
        type: string
      overlay_meaning:
        description: Short idiom meaning shown below the title
        required: true
        type: string
      voice_script:
        description: Full narration script used for subtitles
        required: true
        type: string
      difficulty:
        description: Difficulty rating shown in the info card
        required: true
        type: string
      usage_frequency:
        description: Usage frequency rating shown in the info card
        required: true
        type: string
      korean_history:
        description: Korean history relevance shown in the info card
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JOB_ID: ${{ github.event.inputs.job_id }}
      OVERLAY_TITLE: ${{ github.event.inputs.overlay_title }}
      OVERLAY_MEANING: ${{ github.event.inputs.overlay_meaning }}
      VOICE_SCRIPT: ${{ github.event.inputs.voice_script }}
      DIFFICULTY: ${{ github.event.inputs.difficulty }}
      USAGE_FREQUENCY: ${{ github.event.inputs.usage_frequency }}
      KOREAN_HISTORY: ${{ github.event.inputs.korean_history }}
      END_PADDING_SECONDS: "1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth pillow

      - name: Validate and register repository fonts
        run: |
          set -euo pipefail

          REQUIRED_FONTS=(
            "fonts/NanumMyeongjoExtraBold.ttf"
            "fonts/NanumMyeongjoBold.ttf"
            "fonts/NanumGothicBold.ttf"
          )

          for font_file in "${REQUIRED_FONTS[@]}"; do
            if [ ! -s "$font_file" ]; then
              echo "Required font is missing or empty: $font_file"
              exit 1
            fi
          done

          mkdir -p "$HOME/.local/share/fonts/gangnamhakdang"
          cp fonts/NanumMyeongjoExtraBold.ttf "$HOME/.local/share/fonts/gangnamhakdang/"
          cp fonts/NanumMyeongjoBold.ttf "$HOME/.local/share/fonts/gangnamhakdang/"
          cp fonts/NanumGothicBold.ttf "$HOME/.local/share/fonts/gangnamhakdang/"

          fc-cache -f -v

          echo "Registered repository fonts:"
          fc-match "NanumMyeongjo ExtraBold"
          fc-match "NanumMyeongjo"
          fc-match "NanumGothic"
          fc-match "Noto Serif CJK KR"

      - name: Confirm workflow inputs
        run: |
          echo "JOB_ID=${JOB_ID}"
          echo "OVERLAY_TITLE=${OVERLAY_TITLE}"
          echo "DIFFICULTY=${DIFFICULTY}"
          echo "USAGE_FREQUENCY=${USAGE_FREQUENCY}"
          echo "KOREAN_HISTORY=${KOREAN_HISTORY}"

      - name: Prepare folders and service account
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          mkdir -p input clips output

          if [ -z "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "GCP_SERVICE_ACCOUNT secret is empty."
            exit 1
          fi

          printf '%s' "$GCP_SERVICE_ACCOUNT" > service-account.json

      - name: Download images from Google Drive temp
        env:
          TEMP_FOLDER_ID: ${{ secrets.TEMP_FOLDER_ID }}
        run: |
          python - <<'PY'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import io
          import os
          import re
          import time

          JOB_ID = os.environ.get("JOB_ID", "").strip()
          TEMP_FOLDER_ID = os.environ.get("TEMP_FOLDER_ID", "").strip()

          EXPECTED_SCENES = 7
          MAX_ATTEMPTS = 12
          WAIT_SECONDS = 5
          SCOPES = ["https://www.googleapis.com/auth/drive"]

          if not JOB_ID:
              raise Exception("JOB_ID is empty")

          if not TEMP_FOLDER_ID:
              raise Exception("TEMP_FOLDER_ID secret is empty")

          creds = service_account.Credentials.from_service_account_file(
              "service-account.json",
              scopes=SCOPES,
          )

          drive = build("drive", "v3", credentials=creds)

          safe_job_id = JOB_ID.replace("'", "\\'")
          query = (
              f"'{TEMP_FOLDER_ID}' in parents "
              f"and trashed=false "
              f"and name contains '{safe_job_id}_scene_'"
          )

          def scene_number(name: str):
              match = re.search(r"_scene_(\d+)", name)
              return int(match.group(1)) if match else None

          selected = {}

          for attempt in range(1, MAX_ATTEMPTS + 1):
              results = drive.files().list(
                  q=query,
                  fields="files(id,name,createdTime)",
                  pageSize=1000,
              ).execute()

              files = results.get("files", [])
              selected = {}

              for file_info in files:
                  number = scene_number(file_info["name"])

                  if number is None or not 1 <= number <= EXPECTED_SCENES:
                      continue

                  if number not in selected:
                      selected[number] = file_info
                      continue

                  old_created = selected[number].get("createdTime", "")
                  new_created = file_info.get("createdTime", "")

                  if new_created > old_created:
                      selected[number] = file_info

              found_numbers = sorted(selected.keys())
              print(
                  f"Attempt {attempt}/{MAX_ATTEMPTS}: "
                  f"found scenes {found_numbers} "
                  f"({len(found_numbers)}/{EXPECTED_SCENES})"
              )

              if len(selected) == EXPECTED_SCENES:
                  print("All 7 scene images found.")
                  break

              missing = [
                  number
                  for number in range(1, EXPECTED_SCENES + 1)
                  if number not in selected
              ]

              print(
                  f"Missing scenes: {missing}. "
                  f"Waiting {WAIT_SECONDS} seconds..."
              )
              time.sleep(WAIT_SECONDS)

          if len(selected) != EXPECTED_SCENES:
              missing = [
                  number
                  for number in range(1, EXPECTED_SCENES + 1)
                  if number not in selected
              ]
              raise Exception(
                  f"Expected {EXPECTED_SCENES} scene images, "
                  f"but found {len(selected)}. "
                  f"Missing scenes: {missing}. "
                  f"job_id={JOB_ID}"
              )

          os.makedirs("input", exist_ok=True)

          for scene_idx in range(1, EXPECTED_SCENES + 1):
              file_info = selected[scene_idx]
              output_path = f"input/scene{scene_idx}.png"

              print(f"Downloading image: {file_info['name']} -> {output_path}")

              request = drive.files().get_media(fileId=file_info["id"])

              with io.FileIO(output_path, "wb") as file_handle:
                  downloader = MediaIoBaseDownload(file_handle, request)
                  done = False

                  while not done:
                      _, done = downloader.next_chunk()

              if not os.path.exists(output_path) or os.path.getsize(output_path) == 0:
                  raise Exception(f"Downloaded image is empty: {output_path}")

          with open("image_count.txt", "w", encoding="utf-8") as file:
              file.write(str(EXPECTED_SCENES))

          print("Downloaded all 7 scene images successfully.")
          PY

      - name: Download TTS audio from Google Drive
        env:
          AUDIO_FOLDER_ID: ${{ secrets.AUDIO_FOLDER_ID }}
        run: |
          python - <<'PY'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import io
          import os
          import time

          JOB_ID = os.environ.get("JOB_ID", "").strip()
          AUDIO_FOLDER_ID = os.environ.get("AUDIO_FOLDER_ID", "").strip()
          SCOPES = ["https://www.googleapis.com/auth/drive"]

          if not JOB_ID:
              raise Exception("JOB_ID is empty")

          if not AUDIO_FOLDER_ID:
              raise Exception("AUDIO_FOLDER_ID secret is empty")

          creds = service_account.Credentials.from_service_account_file(
              "service-account.json",
              scopes=SCOPES,
          )

          drive = build("drive", "v3", credentials=creds)

          safe_job_id = JOB_ID.replace("'", "\\'")
          query = (
              f"'{AUDIO_FOLDER_ID}' in parents "
              f"and trashed=false "
              f"and name contains '{safe_job_id}_voice'"
          )

          files = []

          for attempt in range(1, 7):
              results = drive.files().list(
                  q=query,
                  fields="files(id,name,createdTime)",
                  pageSize=100,
              ).execute()

              files = results.get("files", [])

              if files:
                  files.sort(
                      key=lambda file_info: file_info.get("createdTime", ""),
                      reverse=True,
                  )
                  print(
                      f"Found audio file on attempt {attempt}: {files[0]['name']}"
                  )
                  break

              print(
                  f"No audio file found yet for job_id={JOB_ID}. "
                  f"Retry {attempt}/6..."
              )
              time.sleep(5)

          if not files:
              raise Exception(f"No audio file found for job_id={JOB_ID}")

          file_info = files[0]
          request = drive.files().get_media(fileId=file_info["id"])

          with io.FileIO("input/audio.mp3", "wb") as file_handle:
              downloader = MediaIoBaseDownload(file_handle, request)
              done = False

              while not done:
                  _, done = downloader.next_chunk()

          if not os.path.exists("input/audio.mp3") or os.path.getsize("input/audio.mp3") == 0:
              raise Exception("Downloaded audio file is empty")

          print(f"Downloaded audio: {file_info['name']} -> input/audio.mp3")
          PY

      - name: Get audio and final video duration
        run: |
          set -euo pipefail

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/audio.mp3)

          if [ -z "$AUDIO_DURATION" ]; then
            echo "Could not read audio duration."
            exit 1
          fi

          VIDEO_DURATION=$(python - "$AUDIO_DURATION" "$END_PADDING_SECONDS" <<'PY'
          import sys

          audio_duration = float(sys.argv[1])
          end_padding = float(sys.argv[2])

          if audio_duration <= 0:
              raise SystemExit("Audio duration must be greater than zero")

          if end_padding < 0:
              raise SystemExit("END_PADDING_SECONDS must not be negative")

          print(f"{audio_duration + end_padding:.6f}")
          PY
          )

          printf '%s' "$AUDIO_DURATION" > audio_duration.txt
          printf '%s' "$VIDEO_DURATION" > video_duration.txt

          echo "Narration duration: $AUDIO_DURATION"
          echo "End padding: $END_PADDING_SECONDS"
          echo "Final video duration: $VIDEO_DURATION"

      - name: Validate BGM file
        run: |
          set -euo pipefail

          BGM_PATH="assets/bgm.mp3"

          if [ ! -s "$BGM_PATH" ]; then
            echo "BGM file was not found or is empty: $BGM_PATH"
            exit 1
          fi

          BGM_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$BGM_PATH")

          if [ -z "$BGM_DURATION" ]; then
            echo "Could not read BGM duration: $BGM_PATH"
            exit 1
          fi

          python - "$BGM_DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          if duration <= 0:
              raise SystemExit("BGM duration must be greater than zero")

          print(f"Validated BGM duration: {duration:.3f} seconds")
          PY

      - name: Generate polished title and compact info card
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import os
          import re
          import subprocess

          overlay_title = os.environ.get("OVERLAY_TITLE", "").strip()
          overlay_meaning = os.environ.get("OVERLAY_MEANING", "").strip()
          difficulty = os.environ.get("DIFFICULTY", "").strip()
          usage_frequency = os.environ.get("USAGE_FREQUENCY", "").strip()
          korean_history = os.environ.get("KOREAN_HISTORY", "").strip()

          if not overlay_title:
              raise Exception("OVERLAY_TITLE is empty")
          if not overlay_meaning:
              raise Exception("OVERLAY_MEANING is empty")

          FONT_DIR = Path("fonts")
          TITLE_FONT = FONT_DIR / "NanumMyeongjoExtraBold.ttf"
          MYEONGJO_FONT = FONT_DIR / "NanumMyeongjoBold.ttf"
          GOTHIC_FONT = FONT_DIR / "NanumGothicBold.ttf"

          for font_path in (TITLE_FONT, MYEONGJO_FONT, GOTHIC_FONT):
              if not font_path.is_file() or font_path.stat().st_size == 0:
                  raise FileNotFoundError(
                      f"Required repository font is missing or empty: {font_path}"
                  )

          def fc_match(family):
              try:
                  path = subprocess.check_output(
                      ["fc-match", "-f", "%{file}", family],
                      text=True,
                  ).strip()
                  if path and os.path.exists(path):
                      return path
              except Exception:
                  pass
              return ""

          title_font_path = str(TITLE_FONT)
          myeongjo_font_path = str(MYEONGJO_FONT)
          gothic_font_path = str(GOTHIC_FONT)

          # 한자는 CJK 글리프 누락으로 □□□□가 생기지 않도록 Noto Serif CJK를 사용합니다.
          # KR을 우선하고, 환경에 따라 SC로 안전하게 fallback합니다.
          hanja_font_path = (
              fc_match("Noto Serif CJK KR")
              or fc_match("Noto Serif CJK SC")
              or myeongjo_font_path
          )

          allowed_ratings = {"★☆☆", "★★☆", "★★★", "☆☆☆"}

          def normalize_rating(value, default):
              value = re.sub(r"\s+", "", value)
              return value if value in allowed_ratings else default

          difficulty = normalize_rating(difficulty, "★☆☆")
          usage_frequency = normalize_rating(usage_frequency, "★☆☆")
          korean_history = normalize_rating(korean_history, "☆☆☆")

          title_match = re.match(
              r"^\s*(.*?)\s*[\(\（]\s*(.*?)\s*[\)\）]\s*$",
              overlay_title,
          )
          if title_match:
              idiom = title_match.group(1).strip()
              hanja = title_match.group(2).strip()
          else:
              idiom = overlay_title.strip()
              hanja = ""

          def fit_font(draw, text, font_path, max_size, min_size, max_width):
              if not text:
                  return ImageFont.truetype(font_path, min_size)
              for size in range(max_size, min_size - 1, -2):
                  font = ImageFont.truetype(font_path, size)
                  box = draw.textbbox((0, 0), text, font=font, stroke_width=0)
                  width = box[2] - box[0]
                  if width <= max_width:
                      return font
              return ImageFont.truetype(font_path, min_size)

          def centered_x(draw, text, font, canvas_width, stroke_width=0):
              box = draw.textbbox((0, 0), text, font=font, stroke_width=stroke_width)
              width = box[2] - box[0]
              return int((canvas_width - width) / 2)

          def text_size(draw, text, font, stroke_width=0):
              box = draw.textbbox((0, 0), text, font=font, stroke_width=stroke_width)
              return box[2] - box[0], box[3] - box[1]

          def fit_meaning_lines(
              draw,
              text,
              font_path,
              max_size=36,
              min_size=28,
              max_width=850,
              preferred_chars=18,
          ):
              """
              사자성어 뜻 전용 레이아웃.

              - 짧은 뜻은 기존처럼 한 줄로 표시
              - 긴 뜻은 띄어쓰기(단어) 기준으로 최대 2줄 분할
              - 18자 안팎을 선호하되 실제 픽셀 폭(max_width)을 최종 기준으로 사용
              - 가능하면 기존 최대 글자 크기 36을 유지
              - 정말 긴 문장일 때만 2px 단위로 최소 28까지 축소
              """

              text = re.sub(r"\s+", " ", text).strip()

              if not text:
                  return [""], ImageFont.truetype(font_path, max_size)

              words = text.split()

              def line_width(line, font):
                  box = draw.textbbox(
                      (0, 0),
                      line,
                      font=font,
                      stroke_width=4,
                  )
                  return box[2] - box[0]

              # 큰 글씨부터 시도해서 기존 크기감을 최대한 유지
              for size in range(max_size, min_size - 1, -2):
                  font = ImageFont.truetype(font_path, size)
                  full_width = line_width(text, font)

                  # 짧은 뜻은 기존처럼 한 줄
                  if len(text) <= preferred_chars and full_width <= max_width:
                      return [text], font

                  candidates = []

                  # 긴 뜻은 띄어쓰기 기준으로 가장 자연스러운 2줄 지점 탐색
                  if len(words) >= 2:
                      for index in range(1, len(words)):
                          line1 = " ".join(words[:index]).strip()
                          line2 = " ".join(words[index:]).strip()

                          width1 = line_width(line1, font)
                          width2 = line_width(line2, font)

                          if width1 <= max_width and width2 <= max_width:
                              char_over = (
                                  max(0, len(line1) - preferred_chars)
                                  + max(0, len(line2) - preferred_chars)
                              )
                              char_balance = abs(len(line1) - len(line2))
                              pixel_balance = abs(width1 - width2)

                              score = (
                                  char_over * 10000
                                  + char_balance * 100
                                  + pixel_balance
                              )
                              candidates.append((score, line1, line2))

                  if candidates:
                      candidates.sort(key=lambda item: item[0])
                      _, line1, line2 = candidates[0]
                      return [line1, line2], font

                  # 띄어쓰기가 없거나 단어 기준 분할만으로 맞지 않는 예외 처리
                  if len(text) > 1:
                      middle = len(text) // 2
                      split_points = sorted(
                          range(1, len(text)),
                          key=lambda index: abs(index - middle),
                      )

                      for index in split_points:
                          line1 = text[:index].strip()
                          line2 = text[index:].strip()

                          if (
                              line1
                              and line2
                              and line_width(line1, font) <= max_width
                              and line_width(line2, font) <= max_width
                          ):
                              return [line1, line2], font

              # 극단적으로 긴 값에 대한 최종 안전장치
              font = ImageFont.truetype(font_path, min_size)

              if len(words) >= 2:
                  best = None

                  for index in range(1, len(words)):
                      line1 = " ".join(words[:index]).strip()
                      line2 = " ".join(words[index:]).strip()

                      max_line_width = max(
                          line_width(line1, font),
                          line_width(line2, font),
                      )
                      balance = abs(len(line1) - len(line2))
                      score = (max_line_width, balance)

                      if best is None or score < best[0]:
                          best = (score, line1, line2)

                  if best:
                      return [best[1], best[2]], font

              middle = max(1, len(text) // 2)
              return [text[:middle].strip(), text[middle:].strip()], font

          os.makedirs("input", exist_ok=True)

          # ----------------------------------------------------------
          # 상단 제목 영역 최적화
          # - 제목: NanumMyeongjoExtraBold
          # - 한자: Noto Serif CJK (한자 깨짐 방지)
          # - 뜻: NanumMyeongjoBold
          # - 제목은 기존 크기/스타일을 유지하고 위치만 살짝 아래로
          # - 한자/뜻은 진한 먹색 + 밝은 얇은 외곽선 + 약한 그림자로 가독성 강화
          # ----------------------------------------------------------
          title_width = 1080
          title_height = 520
          title_layer = Image.new("RGBA", (title_width, title_height), (0, 0, 0, 0))
          draw = ImageDraw.Draw(title_layer)

          ink = (26, 21, 17, 255)

          # 상단 한자/뜻은 현재 ASS 자막과 같은 가독성 원리로 통일합니다.
          # subtitle.ass:
          #   PrimaryColour = #FFF8EA 계열의 밝은 아이보리
          #   OutlineColour = #1A120D 계열의 진한 먹색
          #   Outline + Shadow 방식
          subtitle_fill = (255, 248, 234, 255)
          subtitle_outline = (26, 18, 13, 255)
          subtitle_shadow = (0, 0, 0, 120)

          # 제목은 기존 스타일을 그대로 유지하기 위해
          # 기존 아이보리 외곽선 색상을 별도로 보존합니다.
          cream_halo = (255, 248, 234, 255)

          line_color = (102, 79, 56, 185)

          idiom_font = fit_font(
              draw,
              idiom,
              title_font_path,
              max_size=132,
              min_size=96,
              max_width=860,
          )

          hanja_display = f"· {hanja} ·" if hanja else ""

          hanja_font = fit_font(
              draw,
              hanja_display if hanja_display else "漢字",
              hanja_font_path,
              max_size=58,
              min_size=44,
              max_width=740,
          )

          meaning_lines, meaning_font = fit_meaning_lines(
              draw,
              overlay_meaning,
              myeongjo_font_path,
              max_size=36,
              min_size=28,
              max_width=850,
              preferred_chars=18,
          )

          title_y = 60
          idiom_x = centered_x(draw, idiom, idiom_font, title_width, stroke_width=4)
          idiom_w, idiom_h = text_size(draw, idiom, idiom_font, stroke_width=4)

          title_shadow = Image.new("RGBA", title_layer.size, (0, 0, 0, 0))
          shadow_draw = ImageDraw.Draw(title_shadow)
          shadow_draw.text(
              (idiom_x + 4, title_y + 6),
              idiom,
              font=idiom_font,
              fill=(0, 0, 0, 95),
          )
          title_shadow = title_shadow.filter(ImageFilter.GaussianBlur(2.2))
          title_layer.alpha_composite(title_shadow)

          draw = ImageDraw.Draw(title_layer)
          draw.text(
              (idiom_x, title_y),
              idiom,
              font=idiom_font,
              fill=ink,
              stroke_width=4,
              stroke_fill=cream_halo,
          )

          current_y = title_y + idiom_h + 14

          if hanja_display:
              hanja_x = centered_x(draw, hanja_display, hanja_font, title_width, stroke_width=2)
              hanja_w, hanja_h = text_size(draw, hanja_display, hanja_font, stroke_width=2)

              # 한자 가독성:
              # 현재 자막과 동일한 원리인
              # '밝은 본문 + 진한 외곽선 + 약한 그림자'로 렌더링합니다.
              # 기존의 밝은 헤일로 방식은 제거해 획이 번져 보이지 않게 합니다.
              hanja_shadow_layer = Image.new(
                  "RGBA",
                  title_layer.size,
                  (0, 0, 0, 0),
              )
              hanja_shadow_draw = ImageDraw.Draw(hanja_shadow_layer)
              hanja_shadow_draw.text(
                  (hanja_x + 3, current_y + 4),
                  hanja_display,
                  font=hanja_font,
                  fill=subtitle_shadow,
                  stroke_width=5,
                  stroke_fill=(0, 0, 0, 95),
              )
              hanja_shadow_layer = hanja_shadow_layer.filter(
                  ImageFilter.GaussianBlur(1.4)
              )
              title_layer.alpha_composite(hanja_shadow_layer)

              draw = ImageDraw.Draw(title_layer)
              draw.text(
                  (hanja_x, current_y),
                  hanja_display,
                  font=hanja_font,
                  fill=subtitle_fill,
                  stroke_width=5,
                  stroke_fill=subtitle_outline,
              )
              current_y += hanja_h + 22
          else:
              current_y += 10

          line_y = current_y + 2
          center_x = title_width // 2
          draw.line((275, line_y, center_x - 42, line_y), fill=line_color, width=2)
          draw.line((center_x + 42, line_y, 805, line_y), fill=line_color, width=2)
          draw.polygon(
              [
                  (center_x, line_y - 7),
                  (center_x + 8, line_y),
                  (center_x, line_y + 7),
                  (center_x - 8, line_y),
              ],
              outline=line_color,
              fill=(0, 0, 0, 0),
          )

          meaning_y = line_y + 18
          meaning_line_spacing = 8

          # 뜻 가독성:
          # - 짧으면 기존처럼 한 줄
          # - 길면 띄어쓰기 기준 최대 2줄
          # - 각 줄은 화면 중앙에 개별 정렬
          # - 기존 밝은 본문 + 진한 외곽선 + 약한 그림자 스타일 유지
          meaning_shadow_layer = Image.new(
              "RGBA",
              title_layer.size,
              (0, 0, 0, 0),
          )
          meaning_shadow_draw = ImageDraw.Draw(meaning_shadow_layer)

          meaning_positions = []
          current_meaning_y = meaning_y

          for meaning_line in meaning_lines:
              meaning_x = centered_x(
                  draw,
                  meaning_line,
                  meaning_font,
                  title_width,
                  stroke_width=4,
              )
              _, meaning_line_h = text_size(
                  draw,
                  meaning_line,
                  meaning_font,
                  stroke_width=4,
              )

              meaning_positions.append(
                  (meaning_x, current_meaning_y, meaning_line)
              )

              meaning_shadow_draw.text(
                  (meaning_x + 3, current_meaning_y + 4),
                  meaning_line,
                  font=meaning_font,
                  fill=subtitle_shadow,
                  stroke_width=4,
                  stroke_fill=(0, 0, 0, 95),
              )

              current_meaning_y += meaning_line_h + meaning_line_spacing

          meaning_shadow_layer = meaning_shadow_layer.filter(
              ImageFilter.GaussianBlur(1.3)
          )
          title_layer.alpha_composite(meaning_shadow_layer)

          draw = ImageDraw.Draw(title_layer)

          for meaning_x, meaning_line_y, meaning_line in meaning_positions:
              draw.text(
                  (meaning_x, meaning_line_y),
                  meaning_line,
                  font=meaning_font,
                  fill=subtitle_fill,
                  stroke_width=4,
                  stroke_fill=subtitle_outline,
              )

          title_layer.save("input/title_overlay.png")

          # ----------------------------------------------------------
          # 정보 카드
          # - 크기/위치/글씨는 그대로 유지
          # - 카드 배경은 기존 약 80% 불투명도에서 약 65% 수준으로 낮춰
          #   배경 일러스트가 조금 더 자연스럽게 비치도록 조정
          # - 테두리/그림자도 함께 소폭 낮춰 카드가 과하게 떠 보이지 않게 구성
          # ----------------------------------------------------------
          card_width = 430
          card_height = 152
          canvas_padding = 18
          radius = 18

          card = Image.new(
              "RGBA",
              (card_width + canvas_padding, card_height + canvas_padding),
              (0, 0, 0, 0),
          )

          card_shadow = Image.new("RGBA", card.size, (0, 0, 0, 0))
          shadow_draw = ImageDraw.Draw(card_shadow)
          shadow_draw.rounded_rectangle(
              (10, 11, card_width + 6, card_height + 7),
              radius=radius,
              fill=(42, 31, 22, 38),
          )
          card_shadow = card_shadow.filter(ImageFilter.GaussianBlur(6))
          card.alpha_composite(card_shadow)

          draw = ImageDraw.Draw(card)
          draw.rounded_rectangle(
              (2, 2, card_width + 2, card_height + 2),
              radius=radius,
              fill=(247, 235, 211, 165),
              outline=(117, 85, 52, 165),
              width=3,
          )
          draw.rounded_rectangle(
              (9, 9, card_width - 5, card_height - 5),
              radius=max(radius - 7, 7),
              outline=(154, 119, 79, 78),
              width=1,
          )

          label_font = ImageFont.truetype(gothic_font_path, 29)
          star_font = ImageFont.truetype(gothic_font_path, 31)

          divider_x = 212
          draw.line(
              (divider_x, 20, divider_x, card_height - 18),
              fill=(142, 101, 60, 155),
              width=2,
          )

          rows = [
              ("난이도", difficulty),
              ("사용빈도", usage_frequency),
              ("한국사", korean_history),
          ]

          label_x = 34
          stars_x = 235
          first_y = 18
          row_gap = 40

          for index, (label, rating) in enumerate(rows):
              y = first_y + index * row_gap
              draw.text(
                  (label_x, y),
                  label,
                  font=label_font,
                  fill=(38, 29, 22, 255),
              )
              draw.text(
                  (stars_x, y),
                  rating,
                  font=star_font,
                  fill=(25, 22, 19, 255),
              )

          card.save("input/info_card.png")

          print(
              "Polished overlays created: "
              f"title={idiom}, hanja={hanja}, "
              f"hanja_font={hanja_font_path}, "
              f"difficulty={difficulty}, "
              f"usage_frequency={usage_frequency}, "
              f"korean_history={korean_history}"
          )
          PY

      - name: Generate subtitle.ass from voice_script
        run: |
          python - <<'PY'
          import os
          import re

          raw_script = os.environ.get("VOICE_SCRIPT", "").strip()
          if not raw_script:
              raise Exception("voice_script input is empty")

          with open("audio_duration.txt", "r", encoding="utf-8") as file:
              audio_duration = float(file.read().strip())

          with open("video_duration.txt", "r", encoding="utf-8") as file:
              video_duration = float(file.read().strip())

          def clean_text(text):
              text = re.sub(r"\[\d+\s*-\s*\d+초\]", "", text)
              text = text.replace("\r", "\n")
              text = re.sub(r"\n{2,}", "\n", text)
              return text.strip()

          def split_sentences(text):
              lines = [line.strip() for line in text.split("\n") if line.strip()]
              result = []

              for line in lines:
                  parts = re.split(r"(?<=[.!?。！？])\s*", line)

                  for part in parts:
                      part = part.strip()
                      if part:
                          result.append(part)

              return result

          def split_korean_chunk(sentence, max_chars=20):
              sentence = sentence.strip()

              if len(sentence) <= max_chars:
                  return [sentence]

              words = sentence.split()
              chunks = []
              current = ""

              if len(words) > 1:
                  for word in words:
                      candidate = (current + " " + word).strip()

                      if len(candidate) <= max_chars:
                          current = candidate
                      else:
                          if current:
                              chunks.append(current)
                          current = word

                  if current:
                      chunks.append(current)
              else:
                  chunks = [
                      sentence[index:index + max_chars]
                      for index in range(0, len(sentence), max_chars)
                  ]

              final_chunks = []

              for chunk in chunks:
                  if len(chunk) <= max_chars:
                      final_chunks.append(chunk)
                  else:
                      final_chunks.extend(
                          chunk[index:index + max_chars]
                          for index in range(0, len(chunk), max_chars)
                      )

              return final_chunks

          def make_caption_text(chunk):
              chunk = chunk.strip()

              if len(chunk) <= 16:
                  return chunk

              words = chunk.split()

              if len(words) >= 2:
                  best_line1 = ""
                  best_line2 = ""
                  smallest_difference = 999

                  for index in range(1, len(words)):
                      line1 = " ".join(words[:index])
                      line2 = " ".join(words[index:])

                      if len(line1) <= 16 and len(line2) <= 16:
                          difference = abs(len(line1) - len(line2))

                          if difference < smallest_difference:
                              smallest_difference = difference
                              best_line1 = line1
                              best_line2 = line2

                  if best_line1 and best_line2:
                      return best_line1 + r"\N" + best_line2

              middle = len(chunk) // 2
              return chunk[:middle].strip() + r"\N" + chunk[middle:].strip()

          def ass_time(seconds):
              seconds = max(0, float(seconds))
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              whole_seconds = int(seconds % 60)
              centiseconds = int(round((seconds - int(seconds)) * 100))

              if centiseconds >= 100:
                  whole_seconds += 1
                  centiseconds = 0

              return (
                  f"{hours}:"
                  f"{minutes:02}:"
                  f"{whole_seconds:02}."
                  f"{centiseconds:02}"
              )

          def escape_ass(text):
              # ASS 줄바꿈 명령 \N은 보존하고,
              # 일반 백슬래시만 이스케이프합니다.
              newline_token = "__ASS_NEWLINE__"

              text = text.replace(r"\N", newline_token)
              text = text.replace("\\", r"\\")
              text = text.replace("{", "")
              text = text.replace("}", "")
              text = text.replace(newline_token, r"\N")

              return text

          script = clean_text(raw_script)
          sentences = split_sentences(script)
          chunks = []

          for sentence in sentences:
              chunks.extend(split_korean_chunk(sentence, max_chars=20))

          chunks = [chunk.strip() for chunk in chunks if chunk.strip()]

          if not chunks:
              raise Exception("No subtitle chunks generated")

          weights = [
              max(len(re.sub(r"\s+", "", chunk)), 4)
              for chunk in chunks
          ]

          total_weight = sum(weights)
          minimum_duration = 0.75
          gap = 0.03
          total_gap_duration = gap * (len(chunks) - 1)
          usable_duration = max(
              audio_duration - total_gap_duration,
              len(chunks) * minimum_duration,
          )

          raw_durations = [
              usable_duration * (weight / total_weight)
              for weight in weights
          ]
          durations = [max(minimum_duration, duration) for duration in raw_durations]
          calculated_total = sum(durations) + total_gap_duration

          if calculated_total > audio_duration:
              scale = audio_duration / calculated_total
              durations = [duration * scale for duration in durations]

          with open("input/subtitle.ass", "w", encoding="utf-8") as file:
              file.write("[Script Info]\n")
              file.write("ScriptType: v4.00+\n")
              file.write("PlayResX: 1080\n")
              file.write("PlayResY: 1920\n\n")
              file.write("[V4+ Styles]\n")
              file.write(
                  "Format: Name, Fontname, Fontsize, PrimaryColour, "
                  "SecondaryColour, OutlineColour, BackColour, Bold, "
                  "Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, "
                  "Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, "
                  "MarginR, MarginV, Encoding\n"
              )
              file.write(
                  "Style: Default,NanumMyeongjo,70,&H00EAF8FF,&H000000FF,"
                  "&H000D121A,&H70000000,1,0,0,0,100,100,-1,0,1,6,2,2,"
                  "95,95,215,1\n\n"
              )
              file.write("[Events]\n")
              file.write(
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, "
                  "MarginV, Effect, Text\n"
              )

              current_time = 0.0

              for index, chunk in enumerate(chunks):
                  start = current_time
                  end = min(start + durations[index], audio_duration)

                  if index == len(chunks) - 1:
                      # 마지막 핵심 문구가 영상 종료와 동시에 잘리지 않도록
                      # 영상의 여유 구간까지 자막을 유지합니다.
                      end = video_duration

                  if end <= start:
                      break

                  caption_text = make_caption_text(chunk)
                  caption_text = escape_ass(caption_text)

                  file.write(
                      "Dialogue: 0,"
                      f"{ass_time(start)},"
                      f"{ass_time(end)},"
                      "Default,,0,0,0,,"
                      f"{caption_text}\n"
                  )

                  current_time = end + gap

                  if current_time >= audio_duration:
                      break

          print(
              f"subtitle.ass created: {len(chunks)} captions, "
              f"audio_duration={audio_duration}, "
              f"video_duration={video_duration}"
          )
          PY

      - name: Create image clips
        run: |
          set -euo pipefail

          IMAGE_COUNT=$(cat image_count.txt)
          VIDEO_DURATION=$(cat video_duration.txt)
          CROSSFADE_DURATION="0.40"

          # xfade는 장면 사이를 겹쳐서 전환하므로,
          # 최종 길이가 VIDEO_DURATION과 정확히 맞도록 각 이미지 클립 길이를 보정합니다.
          CLIP_DURATION=$(python - "$IMAGE_COUNT" "$VIDEO_DURATION" "$CROSSFADE_DURATION" <<'PY'
          import sys

          image_count = int(sys.argv[1])
          video_duration = float(sys.argv[2])
          crossfade_duration = float(sys.argv[3])

          if image_count <= 0:
              raise SystemExit("IMAGE_COUNT must be greater than zero")

          if video_duration <= 0:
              raise SystemExit("VIDEO_DURATION must be greater than zero")

          if crossfade_duration < 0:
              raise SystemExit("CROSSFADE_DURATION must not be negative")

          if image_count == 1:
              clip_duration = video_duration
          else:
              # final = image_count * clip_duration
              #         - (image_count - 1) * crossfade_duration
              clip_duration = (
                  video_duration
                  + (image_count - 1) * crossfade_duration
              ) / image_count

          if clip_duration <= crossfade_duration:
              raise SystemExit(
                  "Clip duration must be longer than crossfade duration"
              )

          print(f"{clip_duration:.6f}")
          PY
          )

          printf '%s' "$CLIP_DURATION" > clip_duration.txt
          printf '%s' "$CROSSFADE_DURATION" > crossfade_duration.txt

          echo "Image count: $IMAGE_COUNT"
          echo "Clip duration: $CLIP_DURATION"
          echo "Crossfade duration: $CROSSFADE_DURATION"

          for i in $(seq 1 "$IMAGE_COUNT"); do
            if [ ! -s "input/scene${i}.png" ]; then
              echo "Missing or empty scene image: input/scene${i}.png"
              exit 1
            fi

            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 \
              -t "$CLIP_DURATION" \
              -i "input/scene${i}.png" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30" \
              -r 30 \
              -an \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              "clips/clip${i}.mp4"
          done

      - name: Create smooth crossfade scene video
        run: |
          set -euo pipefail

          IMAGE_COUNT=$(cat image_count.txt)
          VIDEO_DURATION=$(cat video_duration.txt)
          CLIP_DURATION=$(cat clip_duration.txt)
          CROSSFADE_DURATION=$(cat crossfade_duration.txt)

          if [ "$IMAGE_COUNT" -eq 1 ]; then
            cp clips/clip1.mp4 input/scenes_xfade.mp4
          else
            INPUT_ARGS=()

            for i in $(seq 1 "$IMAGE_COUNT"); do
              INPUT_ARGS+=(-i "clips/clip${i}.mp4")
            done

            FILTER_COMPLEX=$(python - "$IMAGE_COUNT" "$CLIP_DURATION" "$CROSSFADE_DURATION" <<'PY'
          import sys

          image_count = int(sys.argv[1])
          clip_duration = float(sys.argv[2])
          fade_duration = float(sys.argv[3])

          filters = []
          previous = "[0:v]"

          for index in range(1, image_count):
              offset = index * (clip_duration - fade_duration)
              output_label = (
                  "[vxfade]"
                  if index == image_count - 1
                  else f"[xf{index}]"
              )

              filters.append(
                  f"{previous}[{index}:v]"
                  f"xfade=transition=fade:"
                  f"duration={fade_duration:.6f}:"
                  f"offset={offset:.6f}"
                  f"{output_label}"
              )

              previous = output_label

          print(";".join(filters))
          PY
            )

            echo "Crossfade filter:"
            echo "$FILTER_COMPLEX"

            ffmpeg -hide_banner -loglevel error -y \
              "${INPUT_ARGS[@]}" \
              -filter_complex "$FILTER_COMPLEX" \
              -map "[vxfade]" \
              -t "$VIDEO_DURATION" \
              -r 30 \
              -an \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              input/scenes_xfade.mp4
          fi

          if [ ! -s input/scenes_xfade.mp4 ]; then
            echo "Crossfade scene video was not created."
            exit 1
          fi

          XFADE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input/scenes_xfade.mp4)

          python - "$VIDEO_DURATION" "$XFADE_DURATION" <<'PY'
          import sys

          expected = float(sys.argv[1])
          actual = float(sys.argv[2])

          if abs(expected - actual) > 0.25:
              raise SystemExit(
                  f"Crossfade duration mismatch: "
                  f"expected {expected:.3f}s, got {actual:.3f}s"
              )

          print(
              f"Validated crossfade scene duration: "
              f"{actual:.3f}s (target {expected:.3f}s)"
          )
          PY

      - name: Add overlays TTS and BGM
        run: |
          set -euo pipefail

          OUTPUT_VIDEO="output/short_${JOB_ID}.mp4"
          AUDIO_DURATION=$(cat audio_duration.txt)
          VIDEO_DURATION=$(cat video_duration.txt)

          FADE_OUT_DURATION=$(python - "$VIDEO_DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])
          print(min(2.0, max(duration, 0.0)))
          PY
          )

          FADE_OUT_START=$(python - "$VIDEO_DURATION" "$FADE_OUT_DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])
          fade_duration = float(sys.argv[2])
          print(max(duration - fade_duration, 0.0))
          PY
          )

          echo "Narration duration: $AUDIO_DURATION"
          echo "Final video duration: $VIDEO_DURATION"
          echo "Scene transition: dissolve/crossfade 0.40s"
          echo "BGM fade-out start: $FADE_OUT_START"
          echo "BGM fade-out duration: $FADE_OUT_DURATION"
          echo "BGM volume: 0.07"

          ffmpeg -hide_banner -loglevel error -y \
            -i input/scenes_xfade.mp4 \
            -i input/audio.mp3 \
            -stream_loop -1 \
            -i assets/bgm.mp3 \
            -loop 1 \
            -i input/title_overlay.png \
            -loop 1 \
            -i input/info_card.png \
            -filter_complex "\
              [0:v:0][3:v:0]overlay=0:18:format=auto[titled];\
              [titled][4:v:0]overlay=(main_w-overlay_w)/2:1360:format=auto[carded];\
              [carded]ass=input/subtitle.ass:fontsdir=fonts[vout];\
              [1:a:0]aresample=async=1:first_pts=0,volume=1.0,\
              apad=pad_dur=${END_PADDING_SECONDS}[voice];\
              [2:a:0]atrim=0:${VIDEO_DURATION},asetpts=PTS-STARTPTS,\
              aresample=async=1:first_pts=0,volume=0.07,\
              afade=t=in:st=0:d=1,\
              afade=t=out:st=${FADE_OUT_START}:d=${FADE_OUT_DURATION}[bgm];\
              [voice][bgm]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0,\
              alimiter=limit=0.95[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$VIDEO_DURATION" \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            "$OUTPUT_VIDEO"

          if [ ! -s "$OUTPUT_VIDEO" ]; then
            echo "Rendered video was not created: $OUTPUT_VIDEO"
            exit 1
          fi

          RENDERED_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$OUTPUT_VIDEO")

          python - "$VIDEO_DURATION" "$RENDERED_DURATION" <<'PY'
          import sys

          expected = float(sys.argv[1])
          actual = float(sys.argv[2])
          tolerance = 0.20

          if actual + tolerance < expected:
              raise SystemExit(
                  f"Rendered video is too short: expected about {expected:.3f}s, "
                  f"got {actual:.3f}s"
              )

          print(
              f"Validated rendered duration: {actual:.3f}s "
              f"(target {expected:.3f}s)"
          )
          PY

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$OUTPUT_VIDEO"

      - name: Upload mp4 to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ github.event.inputs.job_id }}
          name: Render ${{ github.event.inputs.job_id }}
          fail_on_unmatched_files: true
          files: |
            output/short_${{ github.event.inputs.job_id }}.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
